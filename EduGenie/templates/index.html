<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }} — Learning Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="hero">
    <div class="container">
      <div class="brand-row">
        <div class="logo">E</div>
        <div>
          <p class="eyebrow">AI-POWERED LEARNING</p>
          <h1>EduGenie</h1>
        </div>
      </div>
      <p class="subtitle">
        Ask questions, simplify concepts, generate quizzes, summarize notes,
        and build a learning path with Gemini.
      </p>
    </div>
  </header>

  <main class="container main-content">
    <section class="card">
      <div class="form-grid">
        <label>
          <span>Choose a task</span>
          <select id="task">
            <option value="qa">Ask a Question</option>
            <option value="explain">Explain a Topic</option>
            <option value="quiz">Generate Quiz</option>
            <option value="summarize">Summarize Text</option>
            <option value="learn">Learning Path</option>
          </select>
        </label>

        <label id="level-wrap">
          <span>Learning level</span>
          <select id="level">
            <option value="beginner">Beginner</option>
            <option value="school">School student</option>
            <option value="college">College student</option>
            <option value="advanced">Advanced</option>
          </select>
        </label>
      </div>

      <label>
        <span id="input-label">Your question</span>
        <textarea id="input" rows="9" placeholder="Example: What is the largest ocean?"></textarea>
      </label>

      <div id="extra-controls" class="extra-controls"></div>

      <button id="submit-btn" type="button">Generate Answer</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="result-card" class="card result-card hidden">
      <div class="result-header">
        <h2 id="result-title">Result</h2>
        <button id="copy-btn" class="secondary" type="button">Copy</button>
      </div>
      <div id="result" class="result"></div>
    </section>
  </main>

  <footer>
    EduGenie · FastAPI + Google Gemini · Model: {{ model }}
  </footer>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
